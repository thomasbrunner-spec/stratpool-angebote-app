# ===================================================================
# Stratpool App Template – Docker Compose
# ===================================================================
# Local dev: docker compose up
# Coolify:   set this file as the deployment compose. Coolify reads
#            the SERVICE_FQDN_* labels and injects routing automatically.
# ===================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-stratpool-app}-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-stratpool-app}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      API_PREFIX: /api/v1
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${SERVICE_FQDN_FRONTEND}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-7}
      RENDER_MODEL: ${RENDER_MODEL:-claude-opus-4-7}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-3-large}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      BERATER_NAME: ${BERATER_NAME:-Thomas Brunner}
      BERATER_TITEL: ${BERATER_TITEL:-Senior Partner}
      BERATER_TEL: ${BERATER_TEL:-}
      BERATER_EMAIL: ${BERATER_EMAIL:-tbrunner@eragroup.com}
      RENDER_STORAGE_BUCKET: ${RENDER_STORAGE_BUCKET:-offer-renders}
      ERA_PRESENTATION_SKILL_ID: ${ERA_PRESENTATION_SKILL_ID:-}
      ERA_WORD_SKILL_ID: ${ERA_WORD_SKILL_ID:-}
      FEW_SHOT_FILE_IDS: ${FEW_SHOT_FILE_IDS:-}
    healthcheck:
      # Use 127.0.0.1 explicitly: BusyBox/Alpine resolves "localhost" to ::1 first,
      # which fails when the app only binds IPv4 (0.0.0.0). Same fix as frontend.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Coolify discovers this service for routing if you set SERVICE_FQDN_BACKEND
    # in your Coolify env. Otherwise it stays internal-only.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        GITHUB_PACKAGES_TOKEN: ${GITHUB_PACKAGES_TOKEN}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    container_name: ${COMPOSE_PROJECT_NAME:-stratpool-app}-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    # Coolify auto-generates router labels but skips the service/port binding,
    # which leaves traefik with a 503 "no available server" for the frontend.
    # Define matching services pointing at port 3000 so Coolify's routers
    # ('http-0-<uuid>-frontend' / 'https-0-<uuid>-frontend') resolve correctly.
    labels:
      - "traefik.http.services.http-0-g11iez4mi3txs8x5kmlk79je-frontend.loadbalancer.server.port=3000"
      - "traefik.http.services.https-0-g11iez4mi3txs8x5kmlk79je-frontend.loadbalancer.server.port=3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      BACKEND_API_URL: http://backend:8000
    healthcheck:
      # 127.0.0.1 instead of localhost: BusyBox wget tries IPv6 ([::1]) for
      # "localhost" and fails because Next.js binds IPv4 only. Container ends
      # up unhealthy, Traefik refuses to route to it -> 503 at the FQDN.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

